x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  user: "${AIRFLOW_UID:-501}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud:fraud_local_password@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: hw3_local_secret
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/tasks:/opt/airflow/project/tasks:ro
    - ./fraud_detector:/opt/airflow/project/fraud_detector:ro
    - ./fraud_detector/teta-ml-1-2025:/opt/airflow/data:ro
    - warehouse_state:/opt/airflow/state
    - ./fraud_detector/models:/opt/airflow/models
    - ./fraud_detector/reports:/opt/airflow/reports
    - airflow_logs:/opt/airflow/logs

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-setup:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic scores --partitions 1 --replication-factor 1

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud_local_password
      POSTGRES_DB: fraud
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fraud_detector/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 12

  fraud-detector:
    build:
      context: .
      dockerfile: fraud_detector/Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTIONS_TOPIC: transactions
      SCORES_TOPIC: scores
      MODEL_DIR: /app/models
    volumes:
      - ./fraud_detector/models:/app/models:ro
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  score-writer:
    build:
      context: .
      dockerfile: fraud_detector/Dockerfile
    command: ["python", "-m", "fraud_detector.score_writer"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SCORES_TOPIC: scores
      DATABASE_URL: postgresql://fraud:fraud_local_password@postgres:5432/fraud
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  interface:
    build:
      context: .
      dockerfile: interface/Dockerfile
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTIONS_TOPIC: transactions
      DATABASE_URL: postgresql://fraud:fraud_local_password@postgres:5432/fraud
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  warehouse-init:
    image: apache/airflow:2.10.5-python3.11
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - chown -R ${AIRFLOW_UID:-501}:0 /opt/airflow/state && chmod -R g+rwX /opt/airflow/state
    volumes:
      - warehouse_state:/opt/airflow/state

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-ec", "airflow db migrate && (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.local || airflow users list)"]
    depends_on:
      postgres:
        condition: service_healthy
      warehouse-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 12

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
  warehouse_state:
